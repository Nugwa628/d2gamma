[package]
name = "d2-server"
description = "The authoritative game host: owns d2-sim and validates every intent. Runs in-process for single player and inside every game server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
d2-sim.workspace = true
d2-data.workspace = true
d2-formats.workspace = true
d2-native.workspace = true
d2-proto.workspace = true
d2-net.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
# The hub's loopback QUIC tests (`src/tests/hub.rs`); the server library
# itself does not depend on QUIC.
d2-quic.workspace = true
tokio.workspace = true
# The game constructor and the wired-host session (`tests/game_wired_host.rs`).
test-fixtures.workspace = true
# The wired-host e2e test (`tests/e2e_night_world.rs`) shares the e2e
# world fixture of `d2-client/tests/e2e_support`, whose combat / missile
# tables are `d2_sim::bench_fixtures::combat`'s.
d2-sim = { workspace = true, features = ["bench-fixtures"] }
