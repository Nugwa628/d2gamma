[package]
name = "d2-item-registry"
description = "The item registry of one mod realm: realm item-ID blocks per game, every saved item ID checked, duplicates found, item history (main server only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
d2-formats.workspace = true
d2-sim.workspace = true
rusqlite.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The synthetic item tables of d2-sim's own unit tests.
d2-sim = { workspace = true, features = ["bench-fixtures"] }

