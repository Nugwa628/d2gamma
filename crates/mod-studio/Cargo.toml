[package]
name = "mod-studio"
description = "Separate authoring tool for D2Gamma mods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "Mod-Studio"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.11", features = ["luau", "vendored", "send"] }
d2-sim.workspace = true
d2-formats.workspace = true
d2-proto.workspace = true
d2-item-text.workspace = true
d2-modkit.workspace = true
d2-data.workspace = true
d2-native.workspace = true
serde_json.workspace = true
anyhow.workspace = true
serde.workspace = true
toml = "0.9"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
