version = 1

# monstats aip1..aip6 of the megademon1 row 360 (Normal): 50, 40, 80, 70, 50, 75. Skill 1 is MegademonInferno at skill level 6
# (monstats Sk1lvl), which the body uses as the distance under which it casts at a target it is not yet fighting. The body keeps
# the next time it may cast in an AI param (aip6 = 75 frames after a cast); the graph keeps it with a cooldown. The skill puts the
# unit in the inferno state while it burns; the next think clears it.
[[ai]]
index = 89
name = "Megademon (lifted)"
target = "enemy"

[[ai.cooldown]]
name = "inferno"
seconds = 3

[[ai.state]]
name = "range"

[[ai.state.transition]]
to = "melee"
when = [{ kind = "in_melee" }]

# Not yet in reach but nearer than 6: aip1 = 50% cast the inferno (when it is ready and the unit is not already burning).
[[ai.state.action]]
kind = "use_skill"
slot = 1
starts_cooldown = "inferno"
when = [{ kind = "distance_below", value = 6 }, { kind = "lacks_state", state = 12 }, { kind = "cooldown_ready", name = "inferno" }, { kind = "random", percent = 50 }]

# The burn is over: clear the state and go on.
[[ai.state.action]]
kind = "set_state"
state = 12
on = false
when = [{ kind = "has_state", state = 12 }]

# aip4 = 70% walk toward the target, else stand 10 frames.
[[ai.state.action]]
kind = "move_to"
when = [{ kind = "random", percent = 70 }]

[[ai.state.action]]
kind = "idle"
seconds = 0.4

[[ai.state]]
name = "melee"

[[ai.state.transition]]
to = "range"
when = [{ kind = "out_of_melee" }]

[[ai.state.action]]
kind = "set_state"
state = 12
on = false
when = [{ kind = "has_state", state = 12 }]

# In reach: aip2 = 40% the inferno (when ready), aip3 = 80% a swing, aip5 = 50% a short circle, else stand 5 frames.
[[ai.state.action]]
kind = "use_skill"
slot = 1
starts_cooldown = "inferno"
when = [{ kind = "cooldown_ready", name = "inferno" }, { kind = "random", percent = 40 }]

[[ai.state.action]]
kind = "attack"
attack = 1
when = [{ kind = "random", percent = 80 }]

[[ai.state.action]]
kind = "move_around"
steps = 3
when = [{ kind = "random", percent = 50 }]

[[ai.state.action]]
kind = "idle"
seconds = 0.2
